# Neo4j 5.26 with the Graph Data Science and APOC plugins, for the snapshot graph.
#   docker compose up -d        (reads NEO4J_PASSWORD from .env)
# The data lives in the named volume cti-neo4j-data, so the container can be
# recreated without reloading the graph.
services:
  neo4j:
    image: neo4j:5.26
    container_name: cti-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'   # GDS 2.13.x, APOC 5.26.x (fetched at first start)
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - cti-neo4j-data:/data
    restart: unless-stopped

volumes:
  cti-neo4j-data:
    name: cti-neo4j-data
