[project]
name = "ctiattr"
version = "0.1.0"
description = "Improving small open-source LLMs on CTI entity attribution (CTIConnect ATA/VCA)"
requires-python = ">=3.11"
dependencies = [
    "gensim>=4.4.0",
    "langchain-community<0.4",
    "neo4j>=5.20",
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "ragas>=0.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctiattr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
