[project]
name = "ctiattr"
version = "0.1.0"
description = "Improving small open-source LLMs on CTI entity attribution (CTIConnect ATA/VCA)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctiattr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
